      - AccessTokenAuth: []
      x-source-url: https://dev.max.ru/docs-api/methods/DELETE/subscriptions
      parameters:
      - name: url
        in: query
        required: true
        description: URL, который нужно удалить из подписок на WebHook
        schema:
          type: string
      responses:
        '200':
          description: Отписка от обновлений
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: true, если запрос был успешным, false — в противном случае
                  message:
                    type: string
                    description: Объяснительное сообщение, если результат не был успешным
                required:
                - success
    get:
      tags:
      - subscriptions
      summary: Получение подписок
      description: 'Если ваш бот получает данные через Webhook, этот метод возвращает список всех подписок. При настройке
        уведомлений для production-окружения рекомендуем использовать Webhook


        > Обратите внимание: для отправки вебхуков поддерживается только протокол HTTPS, включая самоподписанные сертификаты.
        HTTP не поддерживается


        Источник описания: [GET /subscriptions](https://dev.max.ru/docs-api/methods/GET/subscriptions)'
      operationId: get_subscriptions
      security:
      - AccessTokenAuth: []
      x-source-url: https://dev.max.ru/docs-api/methods/GET/subscriptions
      responses:
        '200':
          description: Получение подписок
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
                    description: Список текущих подписок
                required:
                - subscriptions
    post:
      tags:
      - subscriptions
      summary: Подписка на обновления
      description: 'Метод настраивает доставку событий бота через Webhook — основной механизм получения событий в продуктовых
        интеграциях. При активной подписке Long Polling не работает


        После вызова метода события отправляются на указанный Webhook-endpoint в виде HTTPS POST-запросов с объектом Update


        Как обрабатывается событие:


        - При наступлении события выполняется вызов Webhook-endpoint

        - Выполняется TLS-валидация целевого endpoint для безопасной передачи данных

        - На endpoint отправляется HTTP-запрос

        - Если при создании подписки указан secret, проверяется заголовок X-Max-Bot-Api-Secret

        - При успешной валидации возвращается HTTP 200 OK

        - Выполняется бизнес-логика обработки события

        - Инициируются вызовы MAX API


        Webhook-endpoint должен быть доступен по HTTPS на порту 443. Ваш сервер должен прослушивать этот порт. Порт в URL
        не указывается:


        > Поддерживается только порт 443. Если endpoint недоступен, события не доставляются


        Перед отправкой событий устанавливается HTTPS-соединение и проверяется TLS-сертификат Webhook-endpoint. Это необходимо
        для безопасной передачи информации


        Требования к сертификату:


        - сертификат выдан доверенным центром сертификации

        - самоподписанные сертификаты не поддерживаются

        - доменное имя в URL совпадает с CN или SAN сертификата

        - сервер предоставляет полную цепочку сертификатов


        > Если TLS-проверка не проходит, события не доставляются


        Webhook-endpoint должен возвращать HTTP 200 в течение 30 секунд. Любой другой код ответа или превышение тайм-аута
        — ошибка доставки


        Источник описания: [POST /subscriptions](https://dev.max.ru/docs-api/methods/POST/subscriptions)'
      operationId: post_subscriptions
      security:
      - AccessTokenAuth: []
      x-source-url: https://dev.max.ru/docs-api/methods/POST/subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: URL HTTPS-endpoint вашего бота. Должен начинаться с https://
                update_types:
                  type: array
                  items:
                    type: string
                  description: 'Пример:


                    Список типов обновлений, которые хочет получать ваш бот. Для полного списка типов см. объект Update'
                secret:
                  type: string
                  pattern: ^[a-zA-Z0-9_-]{5,256}$
                  description: 'от 5 до 256 символов Cекрет, который должен быть отправлен в заголовке X-Max-Bot-Api-Secret
                    в каждом запросе Webhook. Разрешены только символы A-Z, a-z, 0-9, и дефис. Заголовок рекомендован, чтобы
                    запрос поступал из установленного веб-узла


                    Шаблон: `^[a-zA-Z0-9_-]{5,256}$`'
              required:
              - url
      responses:
        '200':
          description: Подписка на обновления
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: true, если запрос был успешным, false — в противном случае
                  message:
                    type: string
                    description: Объяснительное сообщение, если результат не был успешным
                required:
                - success
  /updates:
    get:
      tags:
      - updates
      summary: Получение обновлений
      description: 'Этот метод можно использовать для получения обновлений при разработке и тестировании, если ваш бот не
        подписан на Webhook. Для production-окружения рекомендуем использовать Webhook


        Метод использует долгий опрос (long polling). Каждое обновление имеет свой номер последовательности. Свойство marker
        в ответе указывает на следующее ожидаемое обновление.


        Все предыдущие обновления считаются завершёнными после прохождения параметра marker. Если параметр marker не передан,
        бот получит все обновления, произошедшие после последнего подтверждения


        Источник описания: [GET /updates](https://dev.max.ru/docs-api/methods/GET/updates)'
      operationId: get_updates
      security:
      - AccessTokenAuth: []
      x-source-url: https://dev.max.ru/docs-api/methods/GET/updates
      parameters:
      - name: limit
        in: query
        required: false
        description: 'По умолчанию:


          100 Максимальное количество обновлений для получения


          Диапазон: `[1-1000]`'
        schema:
          type: integer
          default: 100
          x-range-hint: '[1-1000]'
      - name: timeout
        in: query
        required: false
        description: 'По умолчанию:


          30 Тайм-аут в секундах для долгого опроса


          Диапазон: `[0-90]`'
        schema:
          type: integer
          default: 30
          x-range-hint: '[0-90]'
      - name: marker
        in: query
        required: false
        description: Если передан, бот получит обновления, которые еще не были получены. Если не передан, получит все новые
          обновления
        schema:
          type: integer
          nullable: true
      - name: types
        in: query
        required: false
        description: 'Пример:


          types=message_created,message_callback Список типов обновлений, которые бот хочет получить (например, message_created,
          message_callback


          Шаблон: `)`'
        schema:
          type: array
          items:
            type: string
          nullable: true
      responses:
        '200':
          description: Получение обновлений
          content:
            application/json:
              schema:
                type: object
                properties:
                  updates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Update'
                    description: Страница обновлений
                  marker:
                    type: integer
                    nullable: true
                    description: Указатель на следующую страницу данных
                required:
                - updates
  /uploads:
    post:
      tags:
      - uploads
      summary: Загрузка файлов
      description: 'Возвращает URL для последующей загрузки файла


        > Параметр type=photo больше не поддерживается. Если вы использовали type=photo в ранее созданных интеграциях — замените
        его на type=image


        Поддерживаются два типа загрузки:


        - Multipart upload — более простой, но менее надёжный способ. В этом случае используется заголовок Content-Type: multipart/form-data.
        Файл отправляется целиком одним запросом. Если загрузка прервётся, невозможно её возобновить — придётся начать заново

        - Resumable upload — более надёжный способ, если заголовок Content-Type не равен multipart/form-data. Этот способ
        позволяет загружать файл частями и возобновить загрузку с последней успешно загруженной части в случае ошибок


        Общие ограничения для обоих типов загрузки:


        - Максимальный размер файла: 4 ГБ

        - Можно загружать только один файл за раз


        Источник описания: [POST /uploads](https://dev.max.ru/docs-api/methods/POST/uploads)'
      operationId: post_uploads
      security:
      - AccessTokenAuth: []
      x-source-url: https://dev.max.ru/docs-api/methods/POST/uploads
      parameters:
      - name: type
        in: query
        required: true
        description: 'Enum:


          "image" "video" "audio" "file" Тип загружаемого файла


          Поддерживаемые форматы:


          image: JPG, JPEG, PNG, GIF, TIFF, BMP, HEIC video: MP4, MOV, MKV, WEBM, MATROSKA audio: MP3, WAV, M4A и другие file:
          любые типы файлов Значение photo больше не поддерживается. Если вы использовали type=photo в ранее созданных интеграциях
          — замените его на type=image'
        schema:
          type: string
      responses:
        '200':
          description: Загрузка файлов
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: URL для загрузки файла. Срок жизни ссылки не ограничен
                  token:
                    type: string
                    description: Видео- или аудио-токен для отправки сообщения
                required:
                - url
