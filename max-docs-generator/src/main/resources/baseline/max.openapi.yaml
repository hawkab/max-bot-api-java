      security:
      - AccessTokenAuth: []
      x-source-url: https://dev.max.ru/docs-api/methods/POST/answers
      parameters:
      - name: callback_id
        in: query
        required: true
        description: 'от 1 символа Идентификатор кнопки, по которой пользователь кликнул. Бот получает идентификатор как часть
          Update с типом message_callback.


          Можно получить из


          GET:/updates через поле updates[i].callback.callback_id


          Шаблон: `^(?!\s*$).+`'
        schema:
          type: string
          pattern: ^(?!\s*$).+
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  $ref: '#/components/schemas/NewMessageBody'
                  nullable: true
                  description: Заполните это, если хотите изменить текущее сообщение
                notification:
                  type: string
                  nullable: true
                  description: Заполните это, если хотите просто отправить одноразовое уведомление пользователю
      responses:
        '200':
          description: Ответ на callback
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: true, если запрос был успешным, false — в противном случае
                  message:
                    type: string
                    description: Объяснительное сообщение, если результат не был успешным
                required:
                - success
