  /subscriptions:
    delete:
      tags:
      - subscriptions
      summary: Отписка от обновлений
      description: 'Отписывает бота от получения обновлений через Webhook. После вызова этого метода бот перестаёт получать
        уведомления о новых событиях, и становится доступна доставка уведомлений через API с длительным опросом


        Источник описания: [DELETE /subscriptions](https://dev.max.ru/docs-api/methods/DELETE/subscriptions)'
      operationId: delete_subscriptions
