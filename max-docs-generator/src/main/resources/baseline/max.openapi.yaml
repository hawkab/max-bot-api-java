        Источник описания: [Message](https://dev.max.ru/docs-api/objects/Message)'
      properties:
        type:
          type: string
          description: Тип вложения
          enum:
          - image
          - video
          - audio
          - file
          - sticker
          - contact
          - inline_keyboard
          - share
          - location
        payload:
          $ref: '#/components/schemas/AttachmentPayload'
          description: Данные вложения. Набор обязательных полей зависит от type.
        filename:
          type: string
          nullable: true
          description: Имя файла Обязательно, когда type=file.
          x-required-when:
          - type=file
        size:
          type: integer
          nullable: true
          description: Размер файла Обязательно, когда type=file.
          x-required-when:
          - type=file
        width:
          type: integer
          nullable: true
          description: Ширина медиа Обязательно, когда type in {image, video}.
          x-required-when:
          - type in {image, video}
        height:
          type: integer
          nullable: true
          description: Высота медиа Обязательно, когда type in {image, video}.
          x-required-when:
          - type in {image, video}
        duration:
          type: integer
          nullable: true
          description: Длительность медиа в секундах Обязательно, когда type in {video, audio}.
          x-required-when:
          - type in {video, audio}
        thumbnail:
          type: string
          nullable: true
          description: Миниатюра видео Обязательно, когда type=video.
          x-required-when:
          - type=video
        title:
          type: string
          nullable: true
          description: Заголовок вложения Обязательно, когда type=share.
          x-required-when:
          - type=share
        description:
          type: string
          nullable: true
          description: Описание вложения Обязательно, когда type=share.
          x-required-when:
          - type=share
        image_url:
          type: string
          nullable: true
          description: URL изображения для share-вложения Обязательно, когда type=share.
          x-required-when:
          - type=share
        latitude:
          type: number
          nullable: true
          description: Широта Обязательно, когда type=location.
          x-required-when:
          - type=location
        longitude:
          type: number
          nullable: true
          description: Долгота Обязательно, когда type=location.
          x-required-when:
          - type=location
      required:
      - type
      x-required-by-type:
        image:
        - payload.photo_id
        - payload.url
        video:
        - duration
        - thumbnail
        audio:
        - duration
        file:
        - filename
        - size
        sticker:
        - payload.code
        contact: []
        inline_keyboard: []
        share:
        - title
        - description
        - image_url
        location:
        - latitude
        - longitude
